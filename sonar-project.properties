sonar.projectKey=fosrl_pangolin-kube-controller
sonar.organization=fosrl

# Displayed in SonarCloud UI
sonar.projectName=pangolin-kube-controller
sonar.projectVersion=0.1.0-alpha.1

# Source and test configuration
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Go coverage file produced by CI (relative to project root)
sonar.go.coverage.reportPaths=coverage.out

# Recommended: exclude common generated/vendor paths from analysis
sonar.exclusions=vendor/**,**/vendor/**,**/*.generated.go,**/mock_*.go

# Encoding of the source code
sonar.sourceEncoding=UTF-8
