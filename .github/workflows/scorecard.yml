name: Scorecard

on:
  schedule:
    - cron: '23 3 * * 1'
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Only run on default branch for publish mode; schedule already targets default branch
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'pull_request'

    permissions:
      # Needed for SARIF upload / code scanning
      security-events: write
      # Needed if publish_results=true
      id-token: write

      # Extra reads needed on private repos to avoid the GraphQL error
      contents: read
      issues: read
      pull-requests: read
      checks: read
      actions: read
      statuses: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Optional but handy: keep an artifact for debugging
      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
        with:
          sarif_file: results.sarif
          category: '/tool:ossf-scorecard'
