name: Renovate Config Validation

on:
  pull_request:
    paths:
      - '.github/renovate.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate Renovate Config (dry-run)
        uses: renovatebot/github-action@dd5302ec17783b2fc721b19ae7209b57b1587765 # v46.1.17
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: debug           # was input 'logLevel'
          RENOVATE_DRY_RUN: full     # was input 'dryRun' (use 'lookup' for a lighter run)
