version = 1

test_patterns = [
  "**/*_test.go"
]

[[analyzers]]
name = "docker"
enabled = true

[[analyzers]]
name = "go"
enabled = true

  [analyzers.meta]
  import_root = "github.com/fosrl/pangolin-kube-controller"

[[analyzers]]
name = "test-coverage"
enabled = true

[[code_formatters]]
name = "gofmt"
enabled = true
