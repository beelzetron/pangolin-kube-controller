version: '3'

output: interleaved

vars:
  VERSION: '{{.VERSION | default ""}}'

tasks:
  changelog:
    desc: Update unreleased changelog
    cmds:
      - git cliff --unreleased --prepend CHANGELOG.md

  release:
    desc: Cut release changelog
    requires:
      vars: [VERSION]
    cmds:
      - git tag -a v{{.VERSION}} -m "Release v{{.VERSION}}"
      - git cliff --tag v{{.VERSION}} -o CHANGELOG.md
