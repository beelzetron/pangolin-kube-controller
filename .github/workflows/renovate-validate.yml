name: Renovate Config Validation

on:
  pull_request:
    paths:
      - '.github/renovate.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate Renovate Config (dry-run)
        uses: renovatebot/github-action@79dc0ba74dc3de28db0a7aeb1d0b95d5bf5fde2a # v46.1.13
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: debug           # was input 'logLevel'
          RENOVATE_DRY_RUN: full     # was input 'dryRun' (use 'lookup' for a lighter run)
