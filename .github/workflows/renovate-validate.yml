name: Renovate Config Validation

on:
  pull_request:
    paths:
      - '.github/renovate.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate Renovate Config (dry-run)
        uses: renovatebot/github-action@7b4b65bf31e07d4e3e51708d07700fb41bc03166 # v46.1.3
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: debug           # was input 'logLevel'
          RENOVATE_DRY_RUN: full     # was input 'dryRun' (use 'lookup' for a lighter run)
